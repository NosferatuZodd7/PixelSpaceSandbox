# Builds the native gravity kernel (a GDExtension, with godot-cpp) for Linux
# and Windows, tests the project and builds the Windows and Linux executables
# with the official Godot release and export templates (the Windows build
# ships the ANGLE fallback). The Windows build is then started on a real
# Windows machine to check it runs, that its native kernel loads and agrees
# with the GDScript one, and that it can update itself while running.
#
# Publishing (as in OrbisLink), so the game updates itself:
# * every push to the beta branch becomes a test build, a pre-release
#   vX.Y.Z-dev.N (X.Y.Z from project.godot, N this run's number, always
#   going up); the game sees it on the "Test builds" update channel. Only
#   the five newest test builds are kept.
# * a pushed vX.Y.Z tag (equal to project.godot's version) becomes a final
#   release, seen on both channels.
# Each release carries a zip per system and its SHA-256, which the game
# checks before installing. Builds are also in each run's "Artifacts"
# (kept a week).
#
# To spend few Actions minutes: pushes that only change documentation do
# not build, there is no separate pull-request build (work lands on beta
# directly), and a newer push cancels the build of the one before.
name: Build

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in a row on a branch: only the second one's build matters.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

env:
  GODOT_VERSION: 4.7.2
  # godot-cpp, branch 4.5 (extensions built for 4.5 run on later 4.x).
  GODOT_CPP_COMMIT: 27d9dd23c83871e0619fca5dc2cddfbfd69e926a

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      testing: ${{ steps.version.outputs.testing }}
    steps:
      - uses: actions/checkout@v4

      # The version is written into project.godot before exporting, so the
      # game knows which build it is when it looks for updates.
      - name: Decide the version
        id: version
        run: |
          base=$(sed -n 's/^config\/version="\([0-9.]*\)"/\1/p' project.godot)
          if [ -z "$base" ]; then
            echo "::error::Could not read config/version from project.godot."
            exit 1
          fi
          publish=false
          testing=true
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$base" ]; then
              echo "::error::The tag says ${GITHUB_REF_NAME#v} and project.godot says $base."
              exit 1
            fi
            version="v$base"
            publish=true
            testing=false
          else
            version="v$base-dev.$GITHUB_RUN_NUMBER"
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "beta" ]; then
              publish=true
            fi
          fi
          sed -i "s/^config\/version=.*/config\/version=\"${version#v}\"/" project.godot
          grep '^config/version' project.godot
          echo "Version $version (publish: $publish, test build: $testing)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "testing=$testing" >> "$GITHUB_OUTPUT"

      - name: Build the native gravity kernel for Linux and Windows
        run: |
          pip install scons
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64-posix
          cpp="$RUNNER_TEMP/godot-cpp"
          git init -q "$cpp"
          git -C "$cpp" fetch -q --depth 1 https://github.com/godotengine/godot-cpp "$GODOT_CPP_COMMIT"
          git -C "$cpp" checkout -q FETCH_HEAD
          (cd native && scons platform=linux target=template_release godot_cpp="$cpp" -j"$(nproc)")
          (cd native && scons platform=windows target=template_release godot_cpp="$cpp" -j"$(nproc)")
          ls -la native/bin
          test -f native/bin/libpixelspace.linux.x86_64.so
          test -f native/bin/libpixelspace.windows.x86_64.dll

      - name: Install Godot and its export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpz"
          mv "$RUNNER_TEMP"/tpz/templates/* "$templates"/
          rm -rf godot.zip templates.tpz "$RUNNER_TEMP/tpz"
          ls "$templates"

      - name: Run the checks
        run: tools/run_tests.sh

      - name: Export Windows and Linux builds
        run: |
          mkdir -p build/windows build/linux
          "$GODOT" --headless --path . --export-release "Windows Desktop" "$PWD/build/windows/PixelSpaceSandbox.exe"
          "$GODOT" --headless --path . --export-release "Linux" "$PWD/build/linux/PixelSpaceSandbox.x86_64"
          ls -la build/windows build/linux
          test -f build/windows/PixelSpaceSandbox.exe
          test -f build/windows/libpixelspace.windows.x86_64.dll
          test -f build/linux/PixelSpaceSandbox.x86_64
          test -f build/linux/libpixelspace.linux.x86_64.so

      # What the game downloads to update itself: the files at the root of
      # a zip, and the zip's SHA-256 next to it.
      - name: Pack the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          (cd build/windows && zip -q -r "../../release/PixelSpaceSandbox-$VERSION-windows.zip" .)
          (cd build/linux && zip -q -r "../../release/PixelSpaceSandbox-$VERSION-linux.zip" .)
          cd release
          for file in *.zip; do sha256sum "$file" > "$file.sha256"; done
          ls -l
          cat *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PixelSpaceSandbox-windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: PixelSpaceSandbox-linux
          path: build/linux/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  run-on-windows:
    needs: test-and-export
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PixelSpaceSandbox-windows

      - name: Start the game and check it renders
        shell: pwsh
        run: |
          $log = Join-Path $PWD "run.log"
          $game = Start-Process -FilePath .\PixelSpaceSandbox.exe -ArgumentList "--quit-after", "1800", "--log-file", $log -PassThru
          $null = $game.Handle  # keeps the exit code readable after the process ends

          # Best effort: a screenshot of the running game (hosted runners may have no desktop).
          Start-Sleep -Seconds 15
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD "windows-screenshot.png"))
          } catch {
            Write-Host "No screenshot: $_"
          }

          if (-not $game.WaitForExit(180000)) {
            Stop-Process -Id $game.Id -Force
            Get-Content $log -ErrorAction SilentlyContinue
            throw "The game did not quit within 3 minutes (stuck, or showing an error dialog)."
          }
          Get-Content $log
          if ($game.ExitCode -ne 0) { throw "The game exited with code $($game.ExitCode)." }
          if (-not (Select-String -Path $log -Pattern "OpenGL API" -Quiet)) { throw "The renderer did not start." }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR" -CaseSensitive -Quiet) { throw "The game reported script errors." }

      - name: Check the native gravity kernel on Windows
        shell: pwsh
        run: |
          $log = Join-Path $PWD "self-test.log"
          $game = Start-Process -FilePath .\PixelSpaceSandbox.exe -ArgumentList "--headless", "--log-file", $log, "--", "--gravity-self-test" -PassThru
          $null = $game.Handle
          if (-not $game.WaitForExit(300000)) {
            Stop-Process -Id $game.Id -Force
            throw "The self-test did not finish within 5 minutes."
          }
          Get-Content $log
          if ($game.ExitCode -ne 0) { throw "The gravity self-test failed (exit code $($game.ExitCode))." }
          if (-not (Select-String -Path $log -Pattern "kernels agree: true" -Quiet)) { throw "The native kernel did not agree with the GDScript one." }

      # The zip players download, to update with exactly what they get.
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      # Updating replaces the running game and its loaded native library,
      # which Windows only allows by renaming them: install the release zip
      # over a copy of the game while it runs, then start the result. With
      # the antivirus scanning, as on players' PCs (hosted runners turn it
      # off): it holds a freshly written program for seconds.
      - name: Check the game can update itself on Windows
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $false
            Write-Host "Antivirus real-time scanning: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
          } catch {
            Write-Host "Could not turn the antivirus on: $_"
          }
          $copy = Join-Path $env:RUNNER_TEMP "installed"
          New-Item -ItemType Directory -Force -Path $copy | Out-Null
          Copy-Item -Path .\*.exe, .\*.dll -Destination $copy
          $zip = (Get-ChildItem -Path release -Filter *-windows.zip | Select-Object -First 1).FullName
          Write-Host "Updating with $zip"
          $log = Join-Path $PWD "update-test.log"
          $game = Start-Process -FilePath (Join-Path $copy "PixelSpaceSandbox.exe") -ArgumentList "--headless", "--log-file", $log, "--", "--update-self-test=$zip" -PassThru
          $null = $game.Handle
          if (-not $game.WaitForExit(120000)) {
            Stop-Process -Id $game.Id -Force
            throw "The update self-test did not finish within 2 minutes."
          }
          Get-Content $log
          if ($game.ExitCode -ne 0) { throw "The game could not update itself (exit code $($game.ExitCode))." }
          if (-not (Test-Path (Join-Path $copy "PixelSpaceSandbox.exe.old"))) { throw "The running game was not moved aside." }
          $log2 = Join-Path $PWD "after-update.log"
          $again = Start-Process -FilePath (Join-Path $copy "PixelSpaceSandbox.exe") -ArgumentList "--headless", "--quit-after", "60", "--log-file", $log2 -PassThru
          $null = $again.Handle
          if (-not $again.WaitForExit(120000)) {
            Stop-Process -Id $again.Id -Force
            throw "The updated game did not quit."
          }
          Get-Content $log2
          if ($again.ExitCode -ne 0) { throw "The updated game failed to start (exit code $($again.ExitCode))." }
          if (Test-Path (Join-Path $copy "PixelSpaceSandbox.exe.old")) { throw "The old files were not cleared on the next start." }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-run
          path: |
            run.log
            self-test.log
            update-test.log
            after-update.log
            windows-screenshot.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [test-and-export, run-on-windows]
    if: needs.test-and-export.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Publishing a release writes to the repository.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.test-and-export.outputs.version }}
      TESTING: ${{ needs.test-and-export.outputs.testing }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PixelSpaceSandbox ${{ env.VERSION }}${{ env.TESTING == 'true' && ' (test build)' || '' }}
          prerelease: ${{ env.TESTING == 'true' }}
          make_latest: ${{ env.TESTING == 'true' && 'false' || 'true' }}
          files: |
            release/*.zip
            release/*.sha256
          body: |
            Built automatically from commit `${{ github.sha }}`.

            The game updates itself to this build from the title screen
            (Settings → Updates: "Test builds" for test builds). To install
            by hand: unzip the file for your system into a folder and run
            PixelSpaceSandbox.

      # Only the newest test builds matter; the releases page would
      # otherwise fill up with one per push. Final releases are never deleted.
      - name: Delete old test builds
        if: env.TESTING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E -- '-dev\.[0-9]+$' \
            | sort -t. -k4,4nr \
            | tail -n +6 \
            | while read -r tag; do
                echo "Deleting $tag"
                gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
